name: Build nOpenNow Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APKs (Release & Debug)
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nOpenNow-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Generate Update Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_CLEAN="${VERSION#v}"
          cat <<EOF > android/app/build/outputs/apk/release/update.json
          {
            "versionName": "$VERSION_CLEAN",
            "tag_name": "$VERSION",
            "name": "nOpenNow Release $VERSION",
            "releaseNotes": "new OpenNow $VERSION",
            "apkUrl": "https://github.com/anhot11/nOpenNow/releases/download/$VERSION/app-release.apk",
            "debugApkUrl": "https://github.com/anhot11/nOpenNow/releases/download/$VERSION/app-debug.apk"
          }
          EOF

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/update.json
            tools/windows/nOpenNow-Browser.bat
          name: nOpenNow Release ${{ github.ref_name }}
          draft: false
          prerelease: false
